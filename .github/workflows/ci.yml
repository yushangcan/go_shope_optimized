name: baseline-ci

on:
  push:
    branches: [main, feat/frontend-ui]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: go_shope
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123456"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Static checks
        run: |
          go test ./...
          go vet ./...
          go build ./...
          node --check web/assets/app.js
          docker compose config --quiet

      - name: MySQL-backed baseline smoke test
        env:
          SHOPE_SMOKE: "1"
          MYSQL_DSN: root:root123456@tcp(127.0.0.1:3306)/go_shope?charset=utf8mb4&parseTime=True&loc=UTC
          JWT_SECRET: github-actions-baseline-test-secret
        run: go test -run TestBaselineHTTPFlow -v .
