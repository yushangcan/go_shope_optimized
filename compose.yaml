services:
  # MySQL is the only infrastructure component in the current basic CRUD version.
  mysql:
    # Use the locally available MySQL 8.0 image so the project can start even
    # when Docker Desktop cannot reach Docker Hub. MySQL 8.0 supports the SQL
    # and GORM features used by this basic project.
    image: mysql:8.0
    container_name: go-shope-mysql
    restart: unless-stopped
    environment:
      # These are local development credentials only. Do not use them for a public deployment.
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: go_shope
    ports:
      # Optional host mapping: useful when you want to inspect the database with a local GUI.
      - "3307:3306"
    volumes:
      # A named volume keeps database data after `docker compose down`.
      - mysql_data:/var/lib/mysql
    healthcheck:
      # The API waits for this health check rather than guessing whether MySQL has finished starting.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
    container_name: go-shope-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # In Docker Compose, use the service name mysql, not 127.0.0.1.
      MYSQL_DSN: "root:root123456@tcp(mysql:3306)/go_shope?charset=utf8mb4&parseTime=True&loc=Local"
      # A development-only value. Replace it before exposing this service publicly.
      JWT_SECRET: "change-this-local-development-jwt-secret-2026"
    ports:
      - "8080:8080"

volumes:
  mysql_data:
