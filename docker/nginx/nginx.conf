events {}
http {
  upstream seckill_api { least_conn; server api-1:8080; server api-2:8080; }
  server {
    listen 8080;
    location / { proxy_pass http://seckill_api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_connect_timeout 2s; proxy_read_timeout 15s; }
  }
}
