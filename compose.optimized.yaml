services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: go_shope
    volumes:
      - optimized_mysql_data:/var/lib/mysql
    ports: ["3308:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [optimized_redis_data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: seckill
      RABBITMQ_DEFAULT_PASS: seckillpass
    volumes:
      - optimized_rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: { context: ., dockerfile: Dockerfile }
    command: ["/app/api"]
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment: &app-env
      MYSQL_DSN: "root:root123456@tcp(mysql:3306)/go_shope?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: "change-this-local-development-jwt-secret-2026"
      REDIS_ADDR: "redis:6379"
      MQ_URL: "amqp://seckill:seckillpass@rabbitmq:5672/"
      MQ_QUEUE: "seckill.orders"
    ports: ["8081:8080"]
  worker:
    build: { context: ., dockerfile: Dockerfile }
    command: ["/app/worker"]
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: *app-env
      WORKER_NAME: worker-single
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on: [api]
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
volumes:
  optimized_mysql_data:
  optimized_redis_data:
  optimized_rabbitmq_data:
