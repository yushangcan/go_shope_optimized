services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: go_shope
    volumes:
      - optimized_mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - optimized_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-1: &api
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &app-env
      MYSQL_DSN: "root:root123456@tcp(mysql:3306)/go_shope?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: "change-this-local-development-jwt-secret-2026"
      REDIS_ADDR: "redis:6379"
      REDIS_STREAM: "seckill:stream:orders"

  api-2:
    <<: *api

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      WORKER_NAME: worker-1

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      WORKER_NAME: worker-2

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api-1, api-2]
    ports:
      - "8081:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on: [nginx]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  optimized_mysql_data:
  optimized_redis_data:
